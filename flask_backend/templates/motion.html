<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> Motion Sensor</title>

<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}
canvas{
    background:#111827;
    border-radius:10px;
    margin-top:20px;
}
.value{
    font-size:40px;
}
.nav{
    margin-top:30px;
    display:flex;
    justify-content:right;
    gap:15px;
}

.btn{
    padding:12px 20px;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.green{ background:#22c55e; color:white; }
.red{ background:#ef4444; color:white; }
</style>
</head>

<body>
<div class="nav">
    <a href="/" class="btn green">⬅ Dashboard</a>
    <a href="/logout" class="btn red">Logout</a>
</div>
<div class="card">
    <h1>Motion Sensor Live Graph</h1>
    <div class="value" id="motion">Waiting...</div>

    <canvas id="chart"></canvas>
</div>

<script>
const socket = io();

let labels = [];
let values = [];

const ctx = document.getElementById("chart");

const chart = new Chart(ctx,{
    type:"line",
    data:{
        labels:labels,
        datasets:[{
            label:"Motion",
            data:values,
            borderColor:"#4caf50",
            tension:0.3
        }]
    }
});

socket.on("sensor_snapshot", d => {

    let val = d.motion || 0;

    document.getElementById("motion").innerText =
        val == 1 ? " MOTION DETECTED" : " NO MOTION";

    labels.push(new Date().toLocaleTimeString());
    values.push(val);

    if(labels.length > 15){
        labels.shift();
        values.shift();
    }

    chart.update();
});
</script>

</body>
</html>
