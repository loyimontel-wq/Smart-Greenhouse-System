
{% extends "base.html" %}

{% block title %}
Smart Greenhouse Login
{% endblock %}

{% block head %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.9)),
                url('https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }


        .box {
            width: 360px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            animation: fadeIn 0.7s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 15px auto;
            border: 3px solid #22c55e;
            box-shadow: 0 0 20px rgba(34,197,94,0.4);
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: none;
            border-radius: 12px;
            background: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border: 1px solid #22c55e;
            box-shadow: 0 0 10px rgba(34,197,94,0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #22c55e, #16a34a);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(34,197,94,0.4);
        }

        .error {
            color: #f87171;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
{% endblock %}
{% block content %}
<div class="box">

    <img
        class="logo"
        src="https://images.unsplash.com/photo-1516253593875-bd7ba052fbc5?q=80&w=400&auto=format&fit=crop"
        alt="Greenhouse"
    >

    <h2> Smart Greenhouse</h2>

    <div class="subtitle">
        Secure IoT Monitoring Dashboard
    </div>

    <input type="text" id="username" placeholder=" Username">

    <input type="password" id="password" placeholder=" Password">

    <button onclick="login()"> Login</button>

    <div class="error" id="error"></div>

    <div class="footer">
        Real-Time Sensor Monitoring System
    </div>
    <div style="margin-top:30px; display:flex; justify-content:center; gap:15px; flex-wrap:wrap;">

        <a href="/signup" class="btn green"> Sign Up</a>

    </div>
</div>

<script>
function login() {
    fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            window.location.href = "/home";
        } else {
            document.getElementById("error").innerText = " Wrong username or password";
        }
    });
}
</script>
{% endblock %}
