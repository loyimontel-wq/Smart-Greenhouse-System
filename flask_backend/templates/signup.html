{% extends "base.html" %}

{% block title %}
Smart Greenhouse Signup
{% endblock %}

{% block head %}

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                linear-gradient(rgba(15,23,42,0.88), rgba(15,23,42,0.92)),
                url('https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?q=80&w=1600&auto=format&fit=crop');
            background-size:cover;
        }

        .box{
            width:450px;
            background:rgba(30,41,59,0.95);
            padding:35px;
            border-radius:20px;
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#94a3b8;
            margin-bottom:25px;
        }

        input, select{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border:none;
            border-radius:12px;
            background:#0f172a;
            color:white;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#22c55e;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#16a34a;
        }

        .success{ color:#4ade80; text-align:center; margin-top:10px; }
        .error{ color:#f87171; text-align:center; margin-top:10px; }

        .nav{
            position:absolute;
            top:20px;
            right:20px;
        }

        .nav a{
            padding:10px 15px;
            background:#ef4444;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }
    </style>
{% endblock %}

{% block content %}

<div class="nav">
    <a href="/login">Login</a>
</div>

<div class="box">

    <h2>Worker Registration</h2>

    <div class="subtitle">
        Add greenhouse workers
    </div>

    <input id="fullname" placeholder="Full Name">
    <input id="employeeid" placeholder="Employee ID">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone">
    
    <select id="role">
        <option value="">Select Role</option>
        <option>Administrator</option>
        <option>Supervisor</option>
        <option>Technician</option>
        <option>Worker</option>
    </select>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="signup()">Create Account</button>

    <div class="success" id="success"></div>
    <div class="error" id="error"></div>

</div>

<script>
function signup(){

    fetch("/signup", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            fullname: fullname.value,
            employeeid: employeeid.value,
            email: email.value,
            phone: phone.value,
            role: role.value,
            username: username.value,
            password: password.value
        })
    })

    .then(res => res.json())
    .then(data => {

        if(data.success){

            success.innerText = "Account created successfully!";
            error.innerText = "";

            setTimeout(() => {
                window.location.href = "/login";
            }, 1200);

        } else {
            error.innerText = "Failed to create account";
            success.innerText = "";
        }
    });

}
</script>

{% endblock %}
