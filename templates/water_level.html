{% extends "base.html" %}

{% block title %}
Water Level
{% endblock %}

{% block head %}


<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}
canvas{
    background:#111827;
    border-radius:10px;
    margin-top:20px;
}
.value{
    font-size:40px;
}
.nav{
    margin-top:30px;
    display:flex;
    justify-content:right;
    gap:15px;
}

.btn{
    padding:12px 20px;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.green{ background:#22c55e; color:white; }
.red{ background:#ef4444; color:white; }
</style>
{% endblock %}

{% block content %}
<div class="nav">
    <a href="/" class="btn green">⬅ Dashboard</a>
    <a href="/logout" class="btn red">Logout</a>
</div>
<div class="card">
    <h1>📏 Ultrasonic Water Level</h1>
    <div class="value" id="ultra">Waiting...</div>

    <canvas id="chart"></canvas>
</div>

<script>
const socket = io();

let labels = [];
let values = [];

const chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
        labels:labels,
        datasets:[{
            label:"Distance (cm)",
            data:values,
            borderColor:"#38bdf8",
            tension:0.3
        }]
    }
});

socket.on("sensor_snapshot", d => {

    let val = d.ultrasonic || 0;

    document.getElementById("ultra").innerText =
        val + " cm";

    labels.push(new Date().toLocaleTimeString());
    values.push(val);

    if(labels.length > 15){
        labels.shift();
        values.shift();
    }

    chart.update();
});
</script>

{% endblock %}
